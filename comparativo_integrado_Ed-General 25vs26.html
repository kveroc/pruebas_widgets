    campus:[{c:'AGS',v25:7,v26:0},{c:'CCM',v25:106,v26:16},{c:'CEM',v25:13,v26:0},{c:'CHH',v25:11,v26:6},{c:'CSF',v25:30,v26:0},{c:'GDA',v25:156,v26:16},{c:'HER',v25:8,v26:0},{c:'HGO',v25:10,v26:0},{c:'LAG',v25:25,v26:0},{c:'LEO',v25:19,v26:0},{c:'MOR',v25:6,v26:0},{c:'MTY',v25:255,v26:16},{c:'PUE',v25:17,v26:0},{c:'QRO',v25:17,v26:6},{c:'SAL',v25:19,v26:0},{c:'SIN',v25:5,v26:0},{c:'SLP',v25:7,v26:0},{c:'TAM',v25:11,v26:0},{c:'TOL',v25:11,v26:0}],
    nota:'EMCS reorienta identidad: de salud (3 áreas) a ciencias de la vida + socioemocional (2 áreas). Liderazgo y Ética desaparecen. Gana Matemáticas (nueva área). 19 campus → 5.'},
  en:{badge:'EN',badgeClass:'b-en',kpi:{mat19:2,matP26:1,tot25:98,tot26:0},
    areas:[
      {name:'Liderazgo, emprendimiento e innovación',m19:[{c:'AD2035',n:'Introducción a los negocios conscientes'},{c:'EM1011',n:'Emprendimiento e innovación'}],m26:[{c:'EM1012',n:'Emprendimiento, liderazgo e innovación'}]}
    ],
    campus:[{c:'AGS',v25:7,v26:0},{c:'CCM',v25:12,v26:0},{c:'CEM',v25:4,v26:0},{c:'CHH',v25:2,v26:0},{c:'CSF',v25:7,v26:0},{c:'GDA',v25:6,v26:0},{c:'HER',v25:2,v26:0},{c:'HGO',v25:7,v26:0},{c:'LAG',v25:3,v26:0},{c:'LEO',v25:2,v26:0},{c:'MTY',v25:38,v26:0},{c:'QRO',v25:1,v26:0},{c:'SIN',v25:2,v26:0},{c:'SLP',v25:2,v26:0},{c:'TOL',v25:3,v26:0}],
    nota:'EN consolida 2→1 materia, permanece en una sola área temática y no tiene oferta Digital-ED en AD2026. EM1011 actualizada como EM1012 en formato presencial/mixto.'}
};

function buildPanel(key){
  const d=DATA[key];
  const pct=d.kpi.tot25>0?Math.round((d.kpi.tot26-d.kpi.tot25)/d.kpi.tot25*100):0;
  const matDelta=d.kpi.matP26-d.kpi.mat19;
  const div=document.createElement('div');
  div.id='p-'+key;
  div.className='panel'+(key==='all'?' active':'');

  let html=`<div class="badge ${d.badgeClass}">${d.badge}</div>
  <div class="kpi-row">
    <div class="kpi"><div class="kpi-l">Materias EG-2019</div><div class="kpi-v nt">${d.kpi.mat19}</div></div>
    <div class="kpi"><div class="kpi-l">Materias P2026</div><div class="kpi-v ${matDelta>0?'up':matDelta<0?'dn':'nt'}">${d.kpi.matP26} (${matDelta>0?'+':''}${matDelta})</div></div>
    <div class="kpi"><div class="kpi-l">Alumnos Digital-ED AD2025</div><div class="kpi-v nt">${d.kpi.tot25.toLocaleString()}</div></div>
    <div class="kpi"><div class="kpi-l">Alumnos Digital-ED AD2026</div><div class="kpi-v dn">${d.kpi.tot26.toLocaleString()} (${pct}%)</div></div>
  </div>
  <div class="sec-lbl">1 — materias por área temática: plan EG-2019 vs plan EG-P2026</div>
  <div class="legend"><span><i style="background:#534AB7"></i>EG-2019</span><span><i style="background:#1D9E75"></i>EG-P2026</span></div>
  <table class="mat-table">
    <thead><tr><th style="width:22%">Área temática</th><th style="width:7%;text-align:center">2019</th><th style="width:7%;text-align:center">P2026</th><th style="width:32%">Materias EG-2019</th><th style="width:32%">Materias EG-P2026</th></tr></thead>
    <tbody>`;

  d.areas.forEach(a=>{
    const cls=ac(a.name);
    const delta=a.m26.length-a.m19.length;
    const dStr=delta===0?'=':(delta>0?'+'+delta:''+delta);
    const dColor=delta>0?'#3B6D11':delta<0?'#A32D2D':'var(--color-text-secondary)';
    const mats19=a.m19.map(m=>`<div class="mat-item"><span class="mat-clave">${m.c}</span>${m.n}</div>`).join('');
    const mats26=a.m26.map(m=>`<div class="mat-item"><span class="mat-clave" style="border-color:#1D9E75;color:#0F6E56">${m.c}</span>${m.n}${m.nuevo?'<span class="new-tag">nueva área</span>':''}</div>`).join('');
    html+=`<tr>
      <td><span class="area-pill ${cls}">${a.name}</span></td>
      <td style="text-align:center"><span class="count-pill y25-pill">${a.m19.length}</span></td>
      <td style="text-align:center"><span class="count-pill y26-pill">${a.m26.length}</span> <span style="font-size:10px;color:${dColor};font-weight:500">${dStr}</span></td>
      <td>${mats19||'<div style="font-size:11px;color:#185FA5;font-style:italic">Nueva en P2026</div>'}</td>
      <td>${mats26||'<div style="font-size:11px;color:#A32D2D;font-style:italic">Sin continuidad en P2026</div>'}</td>
    </tr>`;
  });

  html+=`</tbody></table>
  <div class="divider"></div>
  <div class="sec-lbl">2 — alumnos Digital-ED por campus: AD2025 vs AD2026</div>
  <div class="legend"><span><i style="background:#534AB7"></i>AD2025</span><span><i style="background:#1D9E75"></i>AD2026</span></div>
  <table class="campus-table" style="margin-top:.5rem">
    <thead><tr><th style="width:11%">Campus</th><th class="bar-col">Comparativo</th><th style="width:13%;text-align:right">AD2025</th><th style="width:13%;text-align:right">AD2026</th><th style="width:15%;text-align:right">Δ</th><th style="width:12%;text-align:right">%</th></tr></thead>
    <tbody>`;

  const maxV=Math.max(...d.campus.map(r=>Math.max(r.v25,r.v26)),1);
  let tot25=0,tot26=0;
  d.campus.forEach(r=>{
    tot25+=r.v25; tot26+=r.v26;
    const delta=r.v26-r.v25;
    const pct2=r.v25>0?Math.round(delta/r.v25*100):null;
    const pillHtml=delta>0?`<span class="pill-u">+${delta}</span>`:delta<0?`<span class="pill-d">${delta}</span>`:`<span class="pill-z">0</span>`;
    const pctStr=pct2!==null?`<span style="font-size:10px;color:${delta<0?'#A32D2D':delta>0?'#3B6D11':'var(--color-text-secondary)'}">${pct2>0?'+':''}${pct2}%</span>`:'—';
    const w25=Math.round(r.v25/maxV*100), w26=Math.round(r.v26/maxV*100);
    html+=`<tr>
      <td style="font-family:var(--font-mono);font-size:11px">${r.c}</td>
      <td class="bar-col"><div class="bar-wrap">
        <div class="bar-row-inner"><div class="bar-track"><div class="bar-fill" style="width:${w25}%;background:#534AB7"></div></div></div>
        <div class="bar-row-inner"><div class="bar-track"><div class="bar-fill" style="width:${w26}%;background:#1D9E75"></div></div></div>
      </div></td>
      <td style="text-align:right;font-size:12px">${r.v25||'—'}</td>
      <td style="text-align:right;font-size:12px">${r.v26>0?r.v26:(r.v25>0?'0':'—')}</td>
      <td style="text-align:right">${pillHtml}</td>
      <td style="text-align:right">${pctStr}</td>
    </tr>`;
  });

  const totD=tot26-tot25;
  const totPct=tot25>0?Math.round(totD/tot25*100):0;
  html+=`<tr class="tot-row"><td colspan="2">Total</td><td style="text-align:right">${tot25.toLocaleString()}</td><td style="text-align:right">${tot26.toLocaleString()}</td><td style="text-align:right"><span class="${totD<0?'pill-d':'pill-u'}">${totD>0?'+':''}${totD.toLocaleString()}</span></td><td style="text-align:right"><span style="font-size:10px;color:#A32D2D">${totPct}%</span></td></tr>`;
  html+=`</tbody></table><div class="nota">${d.nota}</div>`;

  div.innerHTML=html;
  document.getElementById('panels').appendChild(div);
}

Object.keys(DATA).forEach(k=>buildPanel(k));
</script>
